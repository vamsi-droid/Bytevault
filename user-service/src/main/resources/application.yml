# Override with PORT=<n> to start a second instance of this service, e.g.
#   PORT=8091 mvn -pl user-service spring-boot:run
# Both register with Eureka under the same name and the gateway / Feign
# load-balance requests across them.
server:
  port: ${PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5434/bytevault_users
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Pick up a newly started instance within seconds (default is 30s)
    registry-fetch-interval-seconds: 5
  instance:
    # Register as localhost rather than the machine's network IP: everything
    # runs on one machine, and a Wi-Fi IP change would otherwise leave Eureka
    # (and the gateway's load balancer) pointing at a dead address.
    prefer-ip-address: false
    hostname: localhost
    # Unique per instance so two copies on one machine don't overwrite each other
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5

# Shared across every ByteVault service so each one can verify the login JWT
# independently (not just the gateway). See the top-level README for why this
# has to stay byte-for-byte identical everywhere.
jwt:
  secret: bytevault-marketplace-super-secret-jwt-signing-key-2024-college-project-demo-only
  expiration-ms: 3600000

# Default ADMIN account created on first startup (see AdminSeeder).
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:admin123}
  email: ${ADMIN_EMAIL:admin@bytevault.local}

# Exposes /actuator/info (the page Eureka's dashboard links to) and /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: user-service
    description: Handles registration, login and JWT issuance
    port: ${server.port}

logging:
  level:
    org.hibernate.SQL: DEBUG
