server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5434/bytevault_users
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Shared across every ByteVault service so each one can verify the login JWT
# independently (not just the gateway). See the top-level README for why this
# has to stay byte-for-byte identical everywhere.
jwt:
  secret: bytevault-marketplace-super-secret-jwt-signing-key-2024-college-project-demo-only
  expiration-ms: 3600000

logging:
  level:
    org.hibernate.SQL: DEBUG
