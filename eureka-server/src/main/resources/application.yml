server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # This node is the registry itself, so it doesn't need to register with
    # itself or fetch a registry from anywhere else.
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: localhost
  server:
    # Publish newly registered instances within seconds instead of the default
    # 30s response cache, so the gateway can route to them right after startup.
    use-read-only-response-cache: false
    response-cache-update-interval-ms: 3000

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
