# Override with PORT=<n> to start a second instance of this service, e.g.
#   PORT=8092 mvn -pl product-service spring-boot:run
# Both register with Eureka under the same name and the gateway / Feign
# load-balance requests across them.
server:
  port: ${PORT:8082}

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5434/bytevault_products
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Pick up a newly started instance within seconds (default is 30s)
    registry-fetch-interval-seconds: 5
  instance:
    # Register as localhost rather than the machine's network IP: everything
    # runs on one machine, and a Wi-Fi IP change would otherwise leave Eureka
    # (and the gateway's load balancer) pointing at a dead address.
    prefer-ip-address: false
    hostname: localhost
    # Unique per instance so two copies on one machine don't overwrite each other
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5

# Must be byte-for-byte identical to user-service / order-service / api-gateway
# so product-service can verify a login JWT on its own.
jwt:
  secret: bytevault-marketplace-super-secret-jwt-signing-key-2024-college-project-demo-only
  expiration-ms: 3600000

# Separate secret + much shorter expiry, only ever used inside product-service
# to issue and check secure per-purchase download links.
download:
  jwt:
    secret: bytevault-download-link-signing-key-distinct-from-login-jwt-2024-demo
    expiration-ms: 300000

# Exposes /actuator/info (the page Eureka's dashboard links to) and /actuator/health.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: product-service
    description: Product catalog and time-limited download-token issuance
    port: ${server.port}

logging:
  level:
    org.hibernate.SQL: DEBUG
